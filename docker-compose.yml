version: "3.8"

services:
  configsvr1:
    image: mongo:7.0
    container_name: configsvr1
    command: mongod --configsvr --replSet configRS --port 27017 --bind_ip_all
    volumes:
      - configsvr1_data:/data/db
    networks:
      - mongo-shard-net

  shard1svr1:
    image: mongo:7.0
    container_name: shard1svr1
    command: mongod --shardsvr --replSet shard1RS --port 27017 --bind_ip_all
    volumes:
      - shard1svr1_data:/data/db
    networks:
      - mongo-shard-net

  shard2svr1:
    image: mongo:7.0
    container_name: shard2svr1
    command: mongod --shardsvr --replSet shard2RS --port 27017 --bind_ip_all
    volumes:
      - shard2svr1_data:/data/db
    networks:
      - mongo-shard-net

  mongos:
    image: mongo:7.0
    container_name: mongos
    command: mongos --configdb configRS/configsvr1:27017 --port 27017 --bind_ip_all
    ports:
      - "27020:27017"
    depends_on:
      - configsvr1
      - shard1svr1
      - shard2svr1
    networks:
      - mongo-shard-net

volumes:
  configsvr1_data:
  shard1svr1_data:
  shard2svr1_data:

networks:
  mongo-shard-net:
    driver: bridge
